name: Collect All Events

on:
  schedule:
    # Minute bewusst nicht :00 — siehe google-ratings.yml: GitHub-Läufe
    # scheduled exakt zur vollen Stunde sind laut GitHub-Doku am ehesten von
    # Verzögerung/Ausfall bei High-Load betroffen (2026-08-02 beobachtet:
    # kein Lauf zur geplanten Zeit).
    # Bewusst nur noch 1x täglich statt vorher 2x (2026-08-07): eventim und
    # milla blockierten zunehmend mit 403 — weniger Läufe pro Tag bedeuten
    # weniger Requests gegen deren WAF/Rate-Limits.
    - cron: '7 6 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # collect-all.ts ist die einzige Quelle der Wahrheit für die Liste
      # aktiver Collector — neue Sources dort eintragen, nicht hier als
      # zusätzlichen Step duplizieren (siehe Kommentar in collect-all.ts für
      # Quellen, die absichtlich nicht automatisch laufen).
      - run: npm run collect-all
      - run: npm run dedup
