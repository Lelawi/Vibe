name: Collect All Events

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EVENTIM_POSTAL_CODE: ${{ vars.EVENTIM_POSTAL_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # collect-all.ts ist die einzige Quelle der Wahrheit für die Liste
      # aktiver Collector — neue Sources dort eintragen, nicht hier als
      # zusätzlichen Step duplizieren (siehe Kommentar in collect-all.ts für
      # Quellen, die absichtlich nicht automatisch laufen).
      - run: npm run collect-all
      - run: npm run dedup
