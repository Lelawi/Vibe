name: Send Push Notifications

on:
  schedule:
    # Alle 15 Minuten, damit Favoriten-Erinnerungen (3h-Vorlauffenster, siehe
    # collectors/notifications/index.ts) zuverlässig genau einmal treffen.
    # Minute bewusst nicht :00/:15/:30/:45 exakt, sondern leicht versetzt —
    # siehe google-ratings.yml/collect-all.yml: volle Stunden/Viertelstunden
    # sind laut GitHub-Doku am ehesten von Scheduling-Verzögerung betroffen.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run send-notifications
