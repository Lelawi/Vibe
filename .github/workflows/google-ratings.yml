name: Google Ratings

on:
  schedule:
    # Täglich statt seltener: verteilt das Monatsbudget (siehe
    # collectors/sources/google-ratings/index.ts) auf viele kleine Häppchen
    # statt eines einzelnen großen Laufs.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  google-ratings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run google-ratings
