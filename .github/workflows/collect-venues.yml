name: Collect Venues

on:
  schedule:
    # Wöchentlich statt wie collect-all.yml zweimal täglich — Öffnungszeiten
    # in OpenStreetMap ändern sich selten, ein häufigerer Lauf brächte
    # keinen Mehrwert. Minute bewusst nicht :00 — siehe google-ratings.yml/
    # collect-all.yml: volle Stunden sind laut GitHub-Doku am ehesten von
    # Scheduling-Verzögerung betroffen.
    - cron: '11 5 * * 1'
  workflow_dispatch:

jobs:
  collect-venues:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run bars
      - run: npm run restaurants
      - run: npm run spaetis
